<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="aweme:url" content="{{TARGET}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:url" content="{{SELF}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{IMAGE}}">
<link rel="icon" type="image/png" sizes="128x128" href="{{IMAGE}}">
<style>
  :root{
    --ink:#101828; --sub:#667085; --line:rgba(16,24,40,.08);
    --bg:#f4f9ff; --accent:#1268ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;min-height:100svh;
    padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .lead{font-size:clamp(17px,4.6vw,21px);font-weight:600;line-height:1.5;margin:0 0 6px}
  .lead-sub{font-size:clamp(13px,3.6vw,15px);color:var(--sub);margin:0 0 26px;line-height:1.6}

  .card{
    width:min(100%,430px);background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:14px;display:flex;gap:13px;align-items:center;
    box-shadow:0 12px 28px rgba(16,24,40,.07);text-align:left;margin-bottom:26px;
  }
  .thumb{
    width:72px;height:72px;flex:0 0 auto;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#eef2f7,#e2e8f0);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{flex:1;min-width:0}
  .meta .t{
    font-size:17px;font-weight:700;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta .d{
    margin-top:5px;font-size:13px;line-height:1.45;color:var(--sub);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .btn{
    appearance:none;border:0;cursor:pointer;color:#fff;font-weight:700;
    font-size:16px;width:min(100%,260px);height:52px;border-radius:14px;
    background:linear-gradient(180deg,#3d8cff 0%,#1268ff 100%);
    box-shadow:0 14px 28px rgba(18,104,255,.30);
    transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease;
  }
  .btn:active{transform:scale(.975);box-shadow:0 8px 18px rgba(18,104,255,.26)}
  .btn[disabled]{opacity:.55;box-shadow:none;cursor:default}

  .hint{margin-top:16px;font-size:12.5px;color:#98a2b3;line-height:1.7;max-width:320px}
  .hint b{color:var(--accent);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:rgba(16,24,40,.90);color:#fff;font-size:13.5px;
    padding:11px 18px;border-radius:12px;max-width:82vw;line-height:1.5;
    transition:opacity .2s ease,transform .2s ease;z-index:9;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  #dbg{
    display:none;margin-top:18px;font-size:11px;color:#b3bcc9;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;max-width:340px;text-align:left;
  }
</style>
</head>
<body>

<p class="lead">点击下方按钮 👇</p>
<p class="lead-sub">转发给任意好友，即可生成卡片</p>

<div class="card">
  <div class="thumb"><img id="sThumb" src="{{IMAGE}}" alt=""></div>
  <div class="meta">
    <div class="t" id="sTitle">{{TITLE}}</div>
    <div class="d" id="sDesc">{{DESC}}</div>
  </div>
</div>

<button class="btn" id="sBtn" type="button">分享并生成卡片</button>

<p class="hint">若按钮无反应，请点右上角 <b>···</b> 选择「分享」</p>
<p class="hint" id="sNote" style="margin-top:6px;display:none"></p>

<div class="toast" id="sToast"></div>
<pre id="dbg"></pre>

<script>
(function () {
  var TITLE  = {{TITLE_JSON}};
  var DESC   = {{DESC_JSON}};
  var IMAGE  = {{IMAGE_JSON}};
  var TARGET = {{TARGET_JSON}};

  // 字节 CDN 上的兜底封面（用于隔离「图片源」变量）
  var CDN_IMG = 'https://api-v3.tos-cn-shanghai.volces.com/card1.jpg';

  // 关键：抖音卡片要求 share_url 是 aweme:// 协议（webview 壳），传普通 https 会被判失败 code -1
  var SHARE_URL = /^aweme:\/\//i.test(TARGET)
    ? TARGET
    : 'aweme://webview/?url=' + encodeURIComponent(TARGET);

  var dbgOn = /(?:\?|&)debug=1/.test(location.search);
  var dbgEl = document.getElementById('dbg');
  var toastEl = document.getElementById('sToast');
  var noteEl = document.getElementById('sNote');
  var btn = document.getElementById('sBtn');
  var toastTimer = null;

  function log(s) {
    if (!dbgOn) return;
    dbgEl.style.display = 'block';
    dbgEl.textContent += s + '\n';
  }

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 2600);
  }

  function inDouyin() {
    return /douyin|aweme|bytedance/i.test(navigator.userAgent || '');
  }

  function bridge() {
    return window.aweme || (window.__MAGIC__ && window.__MAGIC__.action && window.__MAGIC__.action.jsb) || null;
  }

  function loadBridge() {
    return new Promise(function (resolve, reject) {
      if (bridge()) { resolve(bridge()); return; }
      var src = 'https://lf3-cdn-tos.douyinstatic.com/obj/magic-cn/gecko/offline/douyin/magic_eco/magic-public/bridge-aweme-1.4.6-production.umd.js';
      if (document.querySelector('script[data-aweme-bridge]')) {
        var n = 0;
        var t = setInterval(function () {
          n++;
          if (bridge()) { clearInterval(t); resolve(bridge()); }
          else if (n > 40) { clearInterval(t); reject(new Error('bridge timeout')); }
        }, 100);
        return;
      }
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('data-aweme-bridge', '1');
      s.onload = function () {
        if (bridge()) { resolve(bridge()); return; }
        var n2 = 0;
        var t2 = setInterval(function () {
          n2++;
          if (bridge()) { clearInterval(t2); resolve(bridge()); }
          else if (n2 > 30) { clearInterval(t2); reject(new Error('bridge not injected')); }
        }, 100);
      };
      s.onerror = function () { reject(new Error('bridge script load fail')); };
      document.head.appendChild(s);
      log('loading bridge...');
    });
  }

  // 单次分享尝试：等回调，最多 2.5s；超时视为「面板已弹出」
  function attempt(b, params, tag) {
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        log('[' + tag + '] no callback in 2.5s（面板可能已弹出）');
        resolve({ tag: tag, code: 'no-cb' });
      }, 2500);
      try {
        log('[' + tag + '] share url=' + params.url.slice(0, 48) + ' img=' + params.image.slice(0, 44));
        b.app.share(params, function (res) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          var code = res && res.code;
          log('[' + tag + '] cb code=' + code + ' ' + JSON.stringify(res || {}).slice(0, 180));
          resolve({ tag: tag, code: code, res: res });
        });
      } catch (e) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        log('[' + tag + '] throw ' + (e && e.message));
        resolve({ tag: tag, code: 'throw' });
      }
    });
  }

  function params(shareUrl, img) {
    return {
      platform: 'share_native',
      title: TITLE,
      desc: DESC,
      url: shareUrl,
      innerUrl: shareUrl,
      image: img
    };
  }

  function runSingle(b) {
    return attempt(b, params(SHARE_URL, IMAGE), 'A').then(function (r) {
      if (r.code === -1) toast('分享失败，请点右上角 ··· 手动分享');
      else toast('已拉起分享面板，请选择好友');
      return r;
    });
  }

  // debug 模式跑组合矩阵，定位到底哪个变量导致 code -1
  function runMatrix(b) {
    var plan = [
      { tag: 'A', url: SHARE_URL, img: /^https?:/i.test(IMAGE) && IMAGE.indexOf('douyincloud.run') === -1 ? IMAGE : CDN_IMG, name: 'aweme:// + 非抖音云图' },
      { tag: 'B', url: SHARE_URL, img: IMAGE, name: 'aweme:// + 本页图' },
      { tag: 'C', url: TARGET, img: CDN_IMG, name: 'https + 字节CDN图' }
    ];
    var i = 0;
    function step() {
      if (i >= plan.length) {
        log('全部组合失败，结论：非 url/图片问题，需换平台方案');
        toast('三种组合都失败，请截图日志', 4200);
        return;
      }
      var p = plan[i++];
      log('--- 组合 ' + p.tag + '：' + p.name);
      if (p.tag === 'A' && p.img !== IMAGE) {
        noteEl.style.display = 'block';
        noteEl.innerHTML = '当前封面用的是字节 CDN 测试图（隔离变量用）';
      }
      attempt(b, params(p.url, p.img), p.tag).then(function (r) {
        if (r.code === 0 || r.code === 'no-cb') {
          log('>>> 组合 ' + p.tag + ' 通过');
          if (r.code === 'no-cb') toast('已拉起分享面板，请选择好友');
          return;
        }
        step();
      });
    }
    step();
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    setTimeout(function () { btn.disabled = false; }, 1500);

    if (!inDouyin()) {
      toast('请在抖音内打开本页再分享');
      if (navigator.share) {
        navigator.share({ title: TITLE, text: DESC, url: TARGET }).catch(function () {});
      }
      return;
    }

    loadBridge().then(function (b) {
      if (dbgOn) runMatrix(b);
      else runSingle(b);
    }).catch(function (e) {
      log('ERR ' + e.message);
      if (navigator.share) {
        navigator.share({ title: TITLE, text: DESC, url: TARGET }).catch(function () {});
      } else {
        toast('请点右上角 ··· 手动分享');
      }
    });
  });

  // 运行时把 aweme:url 改成协议壳地址（与趣码一致）
  (function () {
    var m = document.querySelector('meta[name="aweme:url"]');
    if (m) m.setAttribute('content', SHARE_URL);
    log('share_url = ' + SHARE_URL.slice(0, 90));
  })();

  if (inDouyin()) {
    loadBridge().catch(function (e) { log('preheat fail: ' + e.message); });
  } else {
    log('not in douyin ua');
  }

  window.__shareInfo = { title: TITLE, desc: DESC, image: IMAGE, target: TARGET, shareUrl: SHARE_URL };
})();
</script>

</body>
</html>
