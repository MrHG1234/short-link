<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="{{IMAGE}}">
<link rel="shortcut icon" href="{{IMAGE}}">
<link rel="apple-touch-icon" href="{{IMAGE}}">
<link rel="image_src" href="{{IMAGE}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{TITLE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{SELF}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:image:secure_url" content="{{IMAGE}}">
<meta property="og:image:alt" content="{{TITLE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{IMAGE}}">
<meta name="build" content="dycloud-share-v1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#f1f5fb;color:#1b1f26;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 24px;min-height:100vh;min-height:100dvh}
.lead{margin:0;font-size:19px;font-weight:500;text-align:center;letter-spacing:-.01em;color:#1b1f26}
.lead .em{font-size:19px}
.sub{margin:10px 0 0;font-size:19px;font-weight:500;text-align:center;letter-spacing:-.01em}
.preview{width:100%;max-width:420px;margin:38px 0 0;background:#fff;border-radius:18px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 10px 30px rgba(24,60,120,.10);cursor:pointer;
  transition:transform .18s ease}
.preview:active{transform:scale(.985)}
.p-icon{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#eef2f8}
.p-body{min-width:0;flex:1}
.p-title{font-size:16px;font-weight:600;color:#1b1f26;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-desc{margin-top:5px;font-size:13px;color:#8b96a5;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-btn{width:100%;max-width:300px;margin:34px 0 0;appearance:none;border:0;
  border-radius:12px;padding:14px 20px;font-size:16px;font-weight:600;color:#fff;
  font-family:inherit;letter-spacing:.02em;
  background:linear-gradient(180deg,#3d7bff,#2a63f0);
  box-shadow:0 8px 22px rgba(47,107,255,.30);cursor:pointer}
.share-btn:active{transform:translateY(1px);opacity:.92}
.hint{margin:18px 0 0;font-size:12.5px;color:#9aa4b0;text-align:center;line-height:1.8;max-width:320px}
.hint b{color:#5b6b80;font-weight:600}
.tip{position:fixed;inset:0;background:rgba(8,18,38,.76);display:none;
  flex-direction:column;align-items:flex-end;justify-content:flex-start;
  padding:16px 20px 0;z-index:99;color:#fff;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tip.on{display:flex}
.tip .arrow{font-size:36px;line-height:1;transform:rotate(-12deg)}
.tip .tbox{margin-top:10px;align-self:flex-end;max-width:230px;
  font-size:14px;line-height:1.75;text-align:right;color:#eaf1ff}
.tip .tbox b{color:#fff}
@media (max-width:360px){
  .lead,.sub{font-size:17px}
  .preview{margin-top:30px}
  .p-icon{width:56px;height:56px}
}
</style>
</head>
<body>
  <p class="lead">点击下方分享按钮 <span class="em">👇</span></p>
  <p class="sub">转发卡片给任意好友即可生成卡片</p>

  <div class="preview" id="preview" data-target="{{TARGET}}">
    <img class="p-icon" src="{{IMAGE}}" alt="{{TITLE}}">
    <div class="p-body">
      <div class="p-title">{{TITLE}}</div>
      <div class="p-desc">{{DESC}}</div>
    </div>
  </div>

  <button class="share-btn" id="shareBtn" type="button">分享并生成卡片</button>
  <p class="hint">若按钮无反应，请点右上角 <b>···</b> 选择「分享」<br>或长按页面选择「分享给好友」</p>

  <div class="tip" id="tipBox">
    <div class="arrow">↗</div>
    <div class="tbox">请点右上角 <b>···</b><br>选择 <b>分享</b> 或 <b>分享给好友</b></div>
  </div>

<script>
(function(){
  var btn = document.getElementById('shareBtn');
  var tip = document.getElementById('tipBox');
  var preview = document.getElementById('preview');

  function hideTip(){ tip.classList.remove('on'); }
  function showTip(){ tip.classList.add('on'); setTimeout(hideTip, 4000); }

  function tryNativeShare(){
    // 抖音 / 多闪 / 头条系 WebView 分享桥，能调则调，调不到就走兜底引导
    try {
      if (window.tt && typeof window.tt.shareAppMessage === 'function') {
        window.tt.shareAppMessage({
          title: document.title,
          desc: (document.querySelector('meta[name=description]') || {}).content || '',
          imageUrl: (document.querySelector('meta[property="og:image"]') || {}).content || '',
          success: hideTip
        });
        return true;
      }
    } catch (e) {}
    try {
      if (window.JSBridge && typeof window.JSBridge.postMessage === 'function') {
        window.JSBridge.postMessage(JSON.stringify({ func: 'share' }));
        return true;
      }
    } catch (e) {}
    return false;
  }

  btn.addEventListener('click', function(){
    if (tryNativeShare()) { showTip(); return; }
    showTip();
  });

  tip.addEventListener('click', hideTip);

  preview.addEventListener('click', function(){
    var t = preview.getAttribute('data-target');
    if (t && t !== '#' && t !== '') window.location.href = t;
  });

  // 空白处双击也可收起引导层
  document.addEventListener('dblclick', hideTip);
})();
</script>
</body>
</html>
